<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#49b1f5"/>
      <stop offset="100%" stop-color="#00c4b6"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.15" cy="0.2" r="0.6">
      <stop offset="0%" stop-color="#49b1f5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#49b1f5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.8" r="0.55">
      <stop offset="0%" stop-color="#00c4b6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#00c4b6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round">
      <rect width="1200" height="300" rx="0"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#glow1)"/>
    <rect width="1200" height="300" fill="url(#glow2)"/>

    <!-- 网格纹理 -->
    <g stroke="#94a3b8" stroke-opacity="0.06" stroke-width="1">
      <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200"/>
      <path d="M120 0V300M240 0V300M360 0V300M480 0V300M600 0V300M720 0V300M840 0V300M960 0V300M1080 0V300"/>
    </g>

    <!-- 左侧渐变色条 -->
    <rect x="0" y="0" width="4" height="300" fill="url(#accent)"/>

    <!-- Logo 方块 -->
    <rect x="80" y="72" width="72" height="72" rx="16" fill="url(#accent)"/>
    <text x="116" y="122" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
          font-size="40" font-weight="700" fill="#ffffff" text-anchor="middle">L</text>

    <!-- 标题 -->
    <text x="180" y="106" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"
          font-size="34" font-weight="700" fill="#e2e8f0" letter-spacing="0.5">lwsnb</text>
    <text x="180" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"
          font-size="17" fill="#94a3b8" letter-spacing="0.5">折腾代码，也记录生活</text>

    <!-- 底部信息 -->
    <text x="80" y="212" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"
          font-size="15" fill="#94a3b8">前端开发 · Serverless · Cloudflare Workers</text>

    <!-- 标签胶囊 -->
    <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" fill="#49b1f5">
      <rect x="80" y="230" width="98" height="28" rx="14" fill="#49b1f5" fill-opacity="0.13"/>
      <text x="129" y="249" text-anchor="middle">SvelteKit</text>

      <rect x="190" y="230" width="110" height="28" rx="14" fill="#49b1f5" fill-opacity="0.13"/>
      <text x="245" y="249" text-anchor="middle">Cloudflare</text>

      <rect x="312" y="230" width="98" height="28" rx="14" fill="#49b1f5" fill-opacity="0.13"/>
      <text x="361" y="249" text-anchor="middle">Butterfly</text>
    </g>

    <!-- 右侧装饰：代码窗口 -->
    <g transform="translate(760, 58)">
      <rect width="360" height="186" rx="12" fill="#0b1220" fill-opacity="0.82" stroke="#334155" stroke-width="1"/>
      <!-- 三点 -->
      <circle cx="22" cy="20" r="5" fill="#ff5f56"/>
      <circle cx="40" cy="20" r="5" fill="#ffbd2e"/>
      <circle cx="58" cy="20" r="5" fill="#27c93f"/>
      <line x1="0" y1="36" x2="360" y2="36" stroke="#1e293b" stroke-width="1"/>
      <!-- 代码行：等宽字体，逐段显式 x 坐标避免粘连 -->
      <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5">
        <text x="20" y="63" fill="#7dd3fc">const</text><text x="60" y="63" fill="#e2e8f0">blog</text><text x="98" y="63" fill="#94a3b8">=</text><text x="114" y="63" fill="#a5f3fc">await</text><text x="162" y="63" fill="#e2e8f0">build({</text>

        <text x="36" y="88" fill="#cbd5e1">stack:</text><text x="86" y="88" fill="#86efac">'sveltekit'</text><text x="174" y="88" fill="#94a3b8">,</text>

        <text x="36" y="113" fill="#cbd5e1">host:</text><text x="80" y="113" fill="#86efac">'cloudflare'</text><text x="178" y="113" fill="#94a3b8">,</text>

        <text x="36" y="138" fill="#cbd5e1">seo:</text><text x="72" y="138" fill="#fbbf24">true</text><text x="104" y="138" fill="#94a3b8">,</text>

        <text x="20" y="163" fill="#e2e8f0">})</text><text x="44" y="163" fill="#64748b">// 折腾，但不将就</text>
      </g>
    </g>

    <!-- 右下角域名 -->
    <text x="1120" y="278" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
          font-size="13" fill="#475569" text-anchor="end">lwsnb.eu.cc</text>
  </g>
</svg>
